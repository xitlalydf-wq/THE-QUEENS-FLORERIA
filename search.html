<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/public/css/pago.css">
</head>
<body>
  <!-- NAV (copiado de otros archivos) -->
  <header class="topbar">
    <div class="brand">THE QUEENS</div>
    <button class="hamburger" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="menu">
      <a href="/inicio.html">INICIO</a>
      <a href="/productos/ramos.html">RAMOS</a>
      <a href="/productos/decorativos.html">DECORATIVOS</a>
      <a href="/productos/accesorios.html">ACCESORIOS</a>
      <a href="/about.html">SOBRE NOSOTROS</a>
      <a href="/contacto.html">CONTACTO</a>
    </nav>
    <div class="icons">
      <form class="search-form" id="search-form" action="#" method="get">
        <div style="position:relative;">
          <input type="text" name="q" placeholder="Buscar..." value="">
          <ul class="search-suggestions"></ul>
        </div>
      </form>
      <button type="button" form="search-form"><img src="/images/buscar.png" alt="Buscar"></button>
      <a href="#"><img src="/images/usuario.png" alt="Usuario"></a>
      <a href="/Compras/carrito.html"><img src="/images/carrito.png" alt="Carrito"></a>
    </div>
  </header>
  <main>
    <section class="search-results">
      <h2>Resultados de búsqueda</h2>
      <p id="query-text"></p>
      <!-- placeholder para resultados --><div id="results"></div>
    </section>
  </main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.querySelector('.hamburger');
  const menu = document.querySelector('.menu');
  if (btn && menu) {
    btn.addEventListener('click', function() {
      menu.classList.toggle('open');
      btn.classList.toggle('active');
    });
  }

  const sampleProducts = ['Ramos', 'Decorativos', 'Accesorios', 'Flores de temporada'];
  const searchInput = document.querySelector('.search-form input[name=q]');
  const suggestions = document.querySelector('.search-suggestions');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const term = this.value.toLowerCase();
      suggestions.innerHTML = '';
      if (term.length === 0) {
        suggestions.style.display = 'none';
        return;
      }
      const matches = sampleProducts.filter(p => p.toLowerCase().includes(term));
      matches.forEach(m => {
        const li = document.createElement('li');
        li.textContent = m;
        li.addEventListener('click', () => {
          searchInput.value = m;
          suggestions.style.display = 'none';
        });
        suggestions.appendChild(li);
      });
      suggestions.style.display = matches.length ? 'block' : 'none';
    });
    document.addEventListener('click', e => {
      if (!searchInput.contains(e.target)) {
        suggestions.style.display = 'none';
      }
    });

    const searchForm = document.querySelector('.search-form');
    const searchButton = document.querySelector('button[form="search-form"]');
    if (searchButton) {
      searchForm.addEventListener('submit', e => e.preventDefault());
      searchButton.addEventListener('click', function(e) {
        e.preventDefault();
        if (!searchForm.classList.contains('active')) {
          searchForm.classList.add('active');
          searchInput.focus();
        } else {
          const term = searchInput.value.trim().toLowerCase();
          if (term) {
            if (term.includes('ramos')) {
              window.location.href = '/Productos/ramos.html';
            } else if (term.includes('decorativos')) {
              window.location.href = '/Productos/decorativos.html';
            } else if (term.includes('accesorios')) {
              window.location.href = '/Productos/accesorios.html';
            } else {
              window.location.href = '/search.html?q=' + encodeURIComponent(searchInput.value);
            }
          }
        }
      });
    }
  }

  // mostrar término de búsqueda
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  document.getElementById('query-text').textContent = q ? `Has buscado: "${q}"` : 'No se ingresó ningún término.';
  // aquí podrías ejecutar lógica para filtrar productos real
});
</script>
<!--Probando 123-->

</body>
</html>
