<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Panel Admin The Queens</title>
    <link rel="stylesheet" href="/public/CSS/admin-productos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>THE QUEENS</h2>
                <p>Panel Admin</p>
            </div>

            <nav class="admin-menu">
<a href="admin-dashboard.html">Dashboard</a>
<a href="admin-productos.html" class="active">Productos</a>
<a href="admin-pedidos.html">Pedidos</a>
<a href="admin-clientes.html">Clientes</a>
<a href="admin-categorias.html">Categorías</a>
<a href="admin-inventario.html">Inventario</a>
<a href="admin-mensajes.html">Mensajes</a>
<a href="admin-configuracion.html">Configuración</a>
<a href="../inicio.html">Volver a la tienda</a>
</nav>
    
        </aside>

        <!-- MAIN -->
        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <p class="admin-subtitle">Administración</p>
                    <h1>Productos</h1>
                </div>

                <button class="btn-primary">+ Agregar producto</button>
            </header>

            <!-- FILTROS -->
            <section class="admin-toolbar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar producto...">
                </div>

                <div class="filter-box">
                    <select id="filter-categoria">
                        <<option value="todos">Todas las categorías</option>
                        <option value="rosas_rojas">Rosas rojas</option>
                        <option value="rosas_amarillas">Rosas amarillas</option>
                        <option value="tulipanes">Tulipanes</option>
                        <option value="lirios">Lirios</option>
                        <option value="peluches">Peluches</option>
                        <option value="globos_burbuja">Globos burbuja</option>
                        <option value="coronas">Coronas</option>
                        <option value="graduaciones">Graduaciones</option>
                        <option value="arreglos">Arreglos</option>
                        <option value="arreglo_de_carro">Arreglo de carro</option>
                    </select>
                </div>
            </section>

            <!-- TABLA PRODUCTOS -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Lista de productos</h2>
                    <button>Exportar</button>
                </div>

                <div class="table-box">
                    <table id="productos-table">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- FORMULARIO RÁPIDO -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Agregar producto rápido</h2>
                </div>

                <form class="product-form" id="add-product-form" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Tipo</label>
                            <select name="tipo" required id="tipo-select">
                                <option value="">Selecciona tipo</option>
                                <option value="Ramo">Ramo</option>
                                <option value="Accesorio">Accesorio</option>
                                <option value="Decorativo">Decorativo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Nombre del producto</label>
                            <input type="text" name="nombre" placeholder="Ej. Ramo Primavera" required>
                        </div>

                        <div class="form-group">
                            <label>Categoría</label>
                            <select name="categoria" required id="categoria-select">
                                <option value="">Selecciona categoría</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Precio</label>
                            <input type="number" step="0.01" name="precio" placeholder="0.00" required>
                        </div>

                        <div class="form-group">
                            <label>Stock</label>
                            <input type="number" name="stock" placeholder="0" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Descripción</label>
                            <textarea rows="4" name="descripcion" placeholder="Escribe una breve descripción del producto..."></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label>Imagen</label>
                            <input type="file" name="imagen" accept="image/*" id="imagen-input">
                            <small style="color: #666;">O ingresa una URL de imagen abajo</small>
                        </div>

                        <div class="form-group full-width">
                            <label>URL de Imagen (opcional si subes archivo)</label>
                            <input type="url" name="imagenURL" placeholder="https://...">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Guardar producto</button>
                </form>
            </section>

        </main>

    </div>
    <script src="/public/js/admin-utils.js"></script>
    <script src="/public/js/admin-productos.js"></script>
<!--Probando 123-->

</body>
</html>
