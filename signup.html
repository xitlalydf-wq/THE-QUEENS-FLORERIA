<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta</title>

<link rel="stylesheet" href="public/CSS/signup.css">

</head>

<body>

<div id="tulips-layer" aria-hidden="true"></div>

<script>
(() => {
  const layer = document.getElementById("tulips-layer");
  const TULIP_COUNT = 22;

  const colors = [
    { c1: "#ff4d8d", c2: "#ffb3d9" },
    { c1: "#ff5a3c", c2: "#ffd1c7" },
    { c1: "#b04cff", c2: "#e2c6ff" },
    { c1: "#ff2f6f", c2: "#ff9fc2" },
    { c1: "#ffb400", c2: "#ffe3a6" }
  ];

  const rand = (min, max) => Math.random() * (max - min) + min;

  function createTulip(){
    const t = document.createElement("span");
    t.className = "tulip";

    t.style.left = `${rand(0, 100)}vw`;
    t.style.setProperty("--dur", `${rand(7, 15)}s`);
    t.style.setProperty("--del", `${rand(0, 6)}s`);
    t.style.setProperty("--drift", `${rand(-80, 80)}px`);
    t.style.setProperty("--rot", `${rand(-30, 30)}deg`);
    t.style.setProperty("--sc", `${rand(0.7, 1.3)}`);
    t.style.setProperty("--op", `${rand(0.45, 0.95)}`);

    const pick = colors[Math.floor(Math.random() * colors.length)];
    t.style.setProperty("--c1", pick.c1);
    t.style.setProperty("--c2", pick.c2);
    t.style.setProperty("--stem", Math.random() > 0.5 ? "#2f9e57" : "#3aa35c");

    layer.appendChild(t);
  }

  for(let i=0; i<TULIP_COUNT; i++) createTulip();
})();
</script>

<div class="card">

<h2>Crear Cuenta</h2>

<form id="signupForm">
<div class="inputBox">
<input type="text" id="nombre" placeholder="Nombre" required>
</div>

<div class="inputBox">
<input type="email" id="correo" placeholder="Correo" required>
</div>

<div class="inputBox">
<input type="password" id="contrasena" placeholder="Contraseña" required>
</div>

<div class="inputBox">
<input type="password" id="confirmar" placeholder="Confirmar contraseña" required>
</div>

<div class="inputBox">
<button type="submit" class="btn btn-primary">Crear cuenta</button>
</div>
</form>

<div id="mensaje-error" style="color: red; text-align: center; margin-top: 10px; display: none;">
</div>

<div class="small">
¿Ya tienes cuenta? <a href="Index.html">Inicia sesión</a>
</div>

</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const nombre = document.getElementById('nombre').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const contrasena = document.getElementById('contrasena').value;
  const confirmar = document.getElementById('confirmar').value;
  const errorDiv = document.getElementById('mensaje-error');

  errorDiv.style.display = 'none';
  errorDiv.textContent = '';

  if (contrasena !== confirmar) {
    errorDiv.textContent = 'Las contraseñas no coinciden';
    errorDiv.style.display = 'block';
    return;
  }

  if (contrasena.length < 6) {
    errorDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    // use absolute backend address; if the page is opened via Live Server (port 5500)
    // the origin will be different, so force localhost:3000.
    const backendBase = window.location.origin.includes('5500')
        ? 'http://localhost:3000'
        : '';
    const response = await fetch(backendBase + '/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, correo, contrasena })
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`Error ${response.status}: ${errorText}`);
    }

    const data = await response.json();
    alert('Cuenta creada exitosamente. Ahora puedes iniciar sesión.');
    window.location.href = 'index%20pruebas.html';  // redirigir al login
  } catch (err) {
    errorDiv.textContent = err.message || 'Error al crear la cuenta';
    errorDiv.style.display = 'block';
    console.error(err);
  }
});
</script>

</body>
</html>
