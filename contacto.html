<!-- JavaScript de Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Esperar a que el DOM esté completamente cargado
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializar el mapa con coordenadas de Av. 20 de Noviembre, Reynosa
        var map = L.map('map').setView([26.023969, -98.239094], 20);

        // Añadir capa de tiles (mapa base)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Añadir un marcador en la ubicación exacta
        L.marker([26.023969, -98.239094]).addTo(map)
            .bindPopup('<b>THE QUEENS</b><br>Av. 20 de Noviembre, Almaguer<br>88780 Reynosa, Tamps.')
            .openPopup();
    });
</script>
