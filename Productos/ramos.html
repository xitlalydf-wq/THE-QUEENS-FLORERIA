<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramos</title>
    <link rel="stylesheet" href="public/CSS/Ramos.css">
    <link rel="stylesheet" href="public/CSS/Contacto.css">


    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        .cart-counter {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #8B5A3C;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <header class="topbar">
        <div class="brand">THE QUEENS</div>

        <nav class="menu">
            <a href="/inicio.html">INICIO</a>
            <a href="/productos/ramos.html">RAMOS</a>
            <a href="/productos/decorativos.html">ARREGLOS</a>
            <a href="/productos/accesorios.html">ACCESORIOS</a>
            <a href="/sobre-nosotros.html">SOBRE NOSOTROS</a>
            <a href="/contacto.html">CONTACTO</a>
        </nav>

        <div class="icons">
            <a href="#">
                <img src="/images/buscar.png" alt="Buscar">
            </a>

            <a href="/Usuario.html">
                <img src="/images/usuario.png" alt="Usuario">
            </a>

            <a href="/Compras/carrito.html" style="position: relative;">
                <img src="/images/carrito.png" alt="Carrito">
                <span id="cart-counter" class="cart-counter">0</span>
            </a>
        </div>
    </header>

    <!-- SECCIÓN RAMOS -->
    <section class="ramos-section">
        <div class="ramos-container">

            <div class="ramos-header">
                <p class="ramos-subtitle">Colección floral</p>
                <h2 class="ramos-title">Ramos</h2>

                <div class="ramos-tabs">
                    <a href="#" class="tab-link active" data-filter="clasicos">Clásicos</a>
                    <a href="#" class="tab-link" data-filter="premium">Premium</a>
                    <a href="#" class="tab-link" data-filter="especiales">Especiales</a>
                    <a href="#" class="tab-link" data-filter="todos">Todos</a>
                </div>
            </div>

            <div class="ramos-grid" id="ramos-container">
                <!-- Cards will be loaded dynamically -->
            </div>

        </div>
    </section>

    <!-- LOAD PRODUCTS -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/productos')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })

            .then(productos => {
                const container = document.getElementById('ramos-container');
                productos.filter(p => p.tipo === 'ramos').forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'ramo-card';
                    card.setAttribute('data-category', p.Categoria || 'todos');
                    card.innerHTML = `
                        <button class="btn-fav">♡</button>
                        <div class="ramo-img-box">
                            <img src="${p.ImagenURL || '/images/flor.png'}" alt="${p.Nombre}">
                        </div>
                        <h3>${p.Nombre}</h3>
                        <p class="stock">• ${p.Stock > 0 ? 'Disponible' : 'Agotado'}</p>
                        <p class="precio">$${Number(p.Precio).toFixed(2)} MXN</p>
                        <button class="btn-ramo btn-carrito" onclick="cartManager.addProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                            Añadir al carrito
                        </button>
                    `;
                    container.appendChild(card);
                });

                // Setup filters after loading cards
                setupFilters();
                setupFavorites();
            })
            .catch(err => console.error('Error loading products:', err));
    });

    function setupFilters() {
        const tabLinks = document.querySelectorAll('.tab-link');
        const cards = document.querySelectorAll('.ramo-card');

        tabLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                const filter = this.getAttribute('data-filter');

                tabLinks.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');

                cards.forEach(card => {
                    const category = card.getAttribute('data-category');

                    if (filter === 'todos' || category === filter) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    }

    function setupFavorites() {
        document.querySelectorAll(".btn-fav").forEach(boton => {
            boton.addEventListener("click", function(){
                if(this.classList.contains("active")){
                    this.classList.remove("active");
                    this.innerHTML = "♡";
                }else{
                    this.classList.add("active");
                    this.innerHTML = "♥";
                }
            });
        });
    }
    </script>
<script src="/public/js/cart.js"></script>

</body>
