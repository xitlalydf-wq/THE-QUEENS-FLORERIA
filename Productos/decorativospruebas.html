<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorativos</title>

  <link rel="stylesheet" href="../public/CSS/Decorativos.css">
  <link rel="stylesheet" href="../public/CSS/Ramos.css">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="loader-ramos" id="loaderRamos">
  <div class="loader-ramos-content">
    <div class="flower-loader-ramos">
      <span class="petal-r petal-r-1"></span>
      <span class="petal-r petal-r-2"></span>
      <span class="petal-r petal-r-3"></span>
      <span class="petal-r petal-r-4"></span>
      <span class="petal-r petal-r-5"></span>
      <span class="petal-r petal-r-6"></span>
      <span class="flower-center-r"></span>
    </div>

    <h1 class="loader-ramos-title">RAMOS</h1>
    <p class="loader-ramos-subtitle">Colección floral</p>
  </div>

  <div class="loader-ramos-door"></div>
</div>
<!-- NAV -->
<header class="topbar">
  <div class="brand">THE QUEENS</div>

  <nav class="menu">
    <a href="/inicio.html">INICIO</a>
    <a href="/productos/ramospruebas.html">RAMOS</a>
    <a href="/productos/decorativospruebas.html" class="active">ARREGLOS</a>
    <a href="/productos/accesoriospruebas.html">ACCESORIOS</a>
    <a href="/sobre-nosotros.html">SOBRE NOSOTROS</a>
    <a href="/contacto.html">CONTACTO</a>
  </nav>

  <div class="icons">
    <img src="/images/buscar.png">
    <img src="/images/usuario.png">
    <img src="/images/carrito.png">
  </div>
</header>

<!-- SECCIÓN -->
<section class="decorativos-section">

  <div class="decorativos-header">
    <p class="decorativos-subtitle">COLECCIÓN FLORAL</p>
    <h2 class="decorativos-title">Arreglos</h2>

    <div class="decorativos-tabs">
      <button class="tab-link active" data-filter="centros">Centros</button>
      <button class="tab-link" data-filter="eventos">Eventos</button>
      <button class="tab-link" data-filter="especiales">Especiales</button>
      <button class="tab-link" data-filter="todos">Todos</button>
    </div>

    <!-- FILTRO PRECIO -->
    <div class="filtro-precio">
      <button class="precio-btn active" data-precio="todos">Todos</button>
      <button class="precio-btn" data-precio="bajo">Esenciales</button>
      <button class="precio-btn" data-precio="medio">Favoritos</button>
      <button class="precio-btn" data-precio="alto">Exclusivos</button>
    </div>

  </div>

  <div class="decorativos-grid" id="decorativos-container"></div>

</section>

<!-- ================= JS ================= -->
<script>
document.addEventListener('DOMContentLoaded', () => {

  // LOADER
  const loader = document.getElementById("loader");

  setTimeout(() => {
    loader.classList.add("slide-out");

    setTimeout(() => {
      loader.style.display = "none";
    }, 900);
  }, 2200);

  // CARGA PRODUCTOS
  fetch('/api/productos')
    .then(res => res.json())
    .then(productos => {

      const container = document.getElementById('decorativos-container');

      productos
        .filter(p => p.tipo === 'Decorativo')
        .forEach(p => {

          const card = document.createElement('div');
          card.className = 'decorativo-card';
          card.setAttribute('data-category', p.Categoria || 'todos');

          card.innerHTML = `
            <button class="btn-fav">♡</button>
            <div class="decorativo-img-box">
              <img src="${p.ImagenURL || '/images/placeholder.png'}">
            </div>
            <h3>${p.Nombre}</h3>
            <p class="precio">$${Number(p.Precio)}</p>
          `;

          container.appendChild(card);
        });

      setupFilters();
      setupPrecio();
      setupFav();
    });
});

// FILTRO CATEGORIA
function setupFilters() {
  const tabs = document.querySelectorAll('.tab-link');
  const cards = document.querySelectorAll('.decorativo-card');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {

      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const filtro = tab.dataset.filter;

      cards.forEach(card => {
        const cat = card.dataset.category;

        card.style.display =
          (filtro === 'todos' || cat === filtro)
          ? 'block'
          : 'none';
      });
    });
  });
}

// FILTRO PRECIO
function setupPrecio() {
  const botones = document.querySelectorAll('.precio-btn');
  const cards = document.querySelectorAll('.decorativo-card');

  botones.forEach(btn => {
    btn.addEventListener('click', () => {

      botones.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const tipo = btn.dataset.precio;

      cards.forEach(card => {
        const precio = parseFloat(card.querySelector('.precio').innerText.replace('$',''));

        if (
          tipo === 'todos' ||
          (tipo === 'bajo' && precio < 500) ||
          (tipo === 'medio' && precio >= 500 && precio < 1000) ||
          (tipo === 'alto' && precio >= 1000)
        ) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });

    });
  });
}
document.addEventListener("DOMContentLoaded", () => {
    const loaderRamos = document.getElementById("loaderRamos");

    if (!loaderRamos) return;

    setTimeout(() => {
      loaderRamos.classList.add("slide-out");
      document.body.classList.add("page-ramos-ready");

      setTimeout(() => {
        loaderRamos.style.display = "none";
      }, 1000);
    }, 2200);
  });


</script>

</body>
</html>
