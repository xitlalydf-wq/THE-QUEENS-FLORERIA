<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesorios</title>
    <link rel="stylesheet" href="/public/css/Accesorios.css">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<header class="topbar">
    <div class="brand">THE QUEENS</div>

    <nav class="menu">
        <a href="/inicio.html">INICIO</a>
        <a href="/productos/ramos.html">RAMOS</a>
        <a href="/productos/decorativos.html">ARREGLOS</a>
        <a href="/productos/accesorios.html">ACCESORIOS</a>
        <a href="/sobre-nosotros.html">SOBRE NOSOTROS</a>
        <a href="/contacto.html">CONTACTO</a>
    </nav>

    <div class="icons">
        <a href="#">
            <img src="/images/buscar.png" alt="Buscar">
        </a>

        <a href="#">
            <img src="/images/usuario.png" alt="Usuario">
        </a>

        <a href="/Compras/carrito.html">
            <img src="/images/carrito.png" alt="Carrito">
        </a>
    </div>
</header>


    <!-- SECCIÓN ACCESORIOS -->
    <section class="accesorios-section">
        <div class="accesorios-container">
            
            <div class="accesorios-header">
                <p class="accesorios-subtitle">Detalles florales</p>
                <h2 class="accesorios-title">Accesorios</h2>

                <div class="accesorios-tabs">
                    <a href="#" class="tab-link active" data-filter="vases">Jarrones</a>
                    <a href="#" class="tab-link" data-filter="extras">Extras</a>
                    <a href="#" class="tab-link" data-filter="regalos">Regalos</a>
                    <a href="#" class="tab-link" data-filter="todos">Todos</a>
                </div>
            </div>
                <div class="accesorios-grid" id="accesorios-container">
                    <!-- Cards will be loaded dynamically -->
                </div>
        </div>
    </section>

    <!-- Carga dinámica de accesorios -->

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/productos')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })

             .then(productos => {
                const container = document.getElementById('accesorios-container');
                productos.filter(p => p.tipo === 'Accesorio').forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'accesorio-card';
                    card.setAttribute('data-category', p.Categoria || 'todos');
                    card.innerHTML = `
                        <button class="btn-fav">♡</button>
                        <div class="accesorio-img-box">
                            <img src="${p.ImagenURL || '/images/placeholder.png'}" alt="${p.Nombre}">
                        </div>
                        <h3>${p.Nombre}</h3>
                        <p class="stock">• ${p.Stock > 0 ? 'Disponible' : 'Agotado'}</p>
                        <p class="precio">$${Number(p.Precio).toFixed(2)} MXN</p>
                        <a href="../Compras/carrito.html?id=${p.id}" class="btn-accesorio btn-carrito">
                            Añadir al carrito
                        </a>
                    `;
                    container.appendChild(card);
                });

                // Setup filters after loading cards
                setupFilters();
                setupFavorites();
            })
            .catch(err => console.error('Error loading products:', err));
    });

    function setupFilters() {
        const tabLinks = document.querySelectorAll('.tab-link');
        const cards = document.querySelectorAll('.accesorio-card');

        tabLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                const filter = this.getAttribute('data-filter');

                tabLinks.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');

                cards.forEach(card => {
                    const category = card.getAttribute('data-category');

                    if (filter === 'todos' || category === filter) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    }
    </script>

<!-- FAVORITOS -->
<script>
    function setupFavorites() {
        document.querySelectorAll(".btn-fav").forEach(boton => {
            boton.addEventListener("click", function(){
                if(this.classList.contains("active")){
                    this.classList.remove("active");
                    this.innerHTML = "♡";
                }else{
                    this.classList.add("active");
                    this.innerHTML = "♥";
                }
            });
        });
    }
    </script>
<!--Probando 123-->
</body>
</html>
