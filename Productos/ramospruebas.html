<html lang="es">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- PRELOADER RAMOS -->
<div class="loader-ramos" id="loaderRamos">
  <div class="loader-ramos-content">

      <span class="petal-r petal-r-1"></span>
      <span class="petal-r petal-r-2"></span>

      <span class="petal-r petal-r-4"></span>
      <span class="petal-r petal-r-5"></span>
      <span class="petal-r petal-r-6"></span>
      <span class="flower-center-r"></span>
    </div>

    <h1 class="loader-ramos-title">RAMOS</h1>
    <p class="loader-ramos-subtitle">Colección floral</p>
  </div>

  <div class="loader-ramos-door"></div>
</div>
    <!-- NAV -->
    <header class="topbar">
        <a href="/inicio.html" class="brand">THE QUEENS</a>

        <nav class="menu">
            <a href="/inicio.html">INICIO</a>
            <a href="/productos/ramospruebas.html" class="active">RAMOS</a>
            <a href="/productos/decorativospruebas.html">ARREGLOS</a>
            <a href="/productos/accesoriospruebas.html">ACCESORIOS</a>
            <a href="/sobre-nosotros.html">SOBRE NOSOTROS</a>
            <a href="/contacto.html">CONTACTO</a>

        <div class="icons">
            <a href="#">
                <img src="/images/buscar.png" alt="Buscar">
            </a>

            <a href="#">
                <img src="/images/usuario.png" alt="Usuario">
            </a>

            <a href="/Compras/carrito.html">
                <img src="/images/carrito.png" alt="Carrito">
            </a>
        </div>
    </header>

    <!-- SECCIÓN RAMOS -->
    <section class="ramos-section">
        <div class="ramos-container">

            <div class="ramos-header">
                <p class="ramos-subtitle">Colección floral</p>
                <h2 class="ramos-title">Ramos</h2>

                <div class="ramos-tabs">
                    <a href="#" class="tab-link active" data-filter="clasicos">Tulipanes</a>
                    <a href="#" class="tab-link" data-filter="premium">Rosas</a>
                    <a href="#" class="tab-link" data-filter="especiales">Gerberas</a>
                    <a href="#" class="tab-link" data-filter="especiales">Lirios</a>
                    <a href="#" class="tab-link" data-filter="todos">Todos</a>
                </div>
            </div>
  <div class="ramos-filtros-precio">
    <button class="precio-btn active" data-precio="todos">Todos</button>
    <button class="precio-btn" data-precio="bajo">Esenciales</button>
    <button class="precio-btn" data-precio="medio">Favoritos</button>
    <button class="precio-btn" data-precio="alto">Exclusivos</button>
</div>
            <div class="ramos-grid" id="ramos-container">
                <!-- Cards will be loaded dynamically -->
            </div>


        </div>
    </section>

    <!-- LOAD PRODUCTS -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/productos')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            
            .then(productos => {
                const container = document.getElementById('ramos-container');
                productos.filter(p => p.tipo === 'Ramo').forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'ramo-card';
                    card.setAttribute('data-category', p.Categoria || 'todos');
                    card.innerHTML = `
                        <button class="btn-fav">♡</button>
                        <div class="ramo-img-box">
                            <img src="${p.ImagenURL || '/images/placeholder.png'}" alt="${p.Nombre}">
                        </div>
                        <h3>${p.Nombre}</h3>
                        <p class="stock">• ${p.Stock > 0 ? 'Disponible' : 'Agotado'}</p>
                        <p class="precio">$${Number(p.Precio).toFixed(2)} MXN</p>
                        <a href="../Compras/carrito.html?id=${p.id}" class="btn-ramo btn-carrito">
                            Añadir al carrito
                        </a>
                    `;
                    container.appendChild(card);
                });

                // Setup filters after loading cards
                setupFilters();
                setupFavorites();
            })
            .catch(err => console.error('Error loading products:', err));
    });

    function setupFilters() {
        const tabLinks = document.querySelectorAll('.tab-link');
        const cards = document.querySelectorAll('.ramo-card');

        tabLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                const filter = this.getAttribute('data-filter');

                tabLinks.forEach(tab => tab.classList.remove('active'));
                this.classList.add('active');

                cards.forEach(card => {
                    const category = card.getAttribute('data-category');

                    if (filter === 'todos' || category === filter) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    }

    function setupPrecioFilter() {
    const botones = document.querySelectorAll('.precio-btn');
    const cards = document.querySelectorAll('.ramo-card');

    botones.forEach(btn => {
        btn.addEventListener('click', () => {

            botones.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const tipo = btn.dataset.precio;

            cards.forEach(card => {
                const precioTexto = card.querySelector('.precio').innerText;
                const precio = parseFloat(precioTexto.replace('$',''));

                if (tipo === 'todos') {
                    card.style.display = 'block';
                } 
                else if (tipo === 'bajo' && precio < 500) {
                    card.style.display = 'block';
                } 
                else if (tipo === 'medio' && precio >= 500 && precio < 1000) {
                    card.style.display = 'block';
                } 
                else if (tipo === 'alto' && precio >= 1000) {
                    card.style.display = 'block';
                } 
                else {
                    card.style.display = 'none';
                }
            });

        });
    });
}


  document.addEventListener("DOMContentLoaded", () => {
    const loaderRamos = document.getElementById("loaderRamos");

    if (!loaderRamos) return;

    setTimeout(() => {
      loaderRamos.classList.add("slide-out");
      document.body.classList.add("page-ramos-ready");

      setTimeout(() => {
        loaderRamos.style.display = "none";
      }, 1000);
    }, 2200);
  });

  </script>  


</body>
